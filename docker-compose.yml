services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emi_marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emi_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/emi_marketplace?schema=public
      PORT: 4000
      CLIENT_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
